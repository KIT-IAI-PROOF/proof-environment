services:

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:latest
    restart: no
    networks:
      - proof
    volumes:
      - "../keycloak/providers:/opt/keycloak/providers:rw"
      - "../keycloak/import:/opt/keycloak/data/import:rw"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin
      KC_DB_URL_PORT: 5432
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
    command:
      - "start-dev"
      - "--import-realm"
    ports:
      - "8080:8080"

  postgres:
    container_name: postgres
    image: postgres:latest
    restart: no
    networks:
      - proof
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: admin
      POSTGRES_ENCODING: UNICODE
      POSTGRES_COLLATE: C
      POSTGRES_COLLATE_TYPE: C
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "../postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro"
    ports:
      - "5432:5432"

  redis:
    container_name: redis
    image: redis:latest
    restart: no
    networks:
      - proof
    ports:
      - "6379:6379"

  config-manager:
    container_name: config-manager
    image: iai-artifactory.iai.kit.edu/docker-webis/proof-2/proof-config-manager:1.1.2
    restart: no
    networks:
      - proof
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/proof"
      SPRING_DATA_REDIS_HOST: "redis"
      WEBSOCKET_BROKER_RELAYHOST: "rabbitmq"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER: http://keycloak:8080/realms/proof
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://keycloak:8080/realms/proof/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN-URI: http://keycloak:8080/realms/proof/protocol/openid-connect/token
    ports:
      - "8100:8100"

  frontend:
    container_name: frontend
    image: iai-artifactory.iai.kit.edu/docker-webis/proof-2/proof-ui:3.0.20
    restart: no
    networks:
      - proof
    ports:
      - "80:80"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    restart: no
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - "../rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro"
    networks:
      - proof
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15674:15674"
      - "61613:61613"

networks:

  proof:
    external: false
    name: proof