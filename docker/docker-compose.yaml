services:

  proof-keycloak:
    container_name: proof-keycloak
    image: quay.io/keycloak/keycloak:26.0.7
    restart: always
    networks:
      - proof
    volumes:
      - "../services/keycloak/providers:/opt/keycloak/providers:rw"
      - "../services/keycloak/import:/opt/keycloak/data/import:rw"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin
      KC_DB_URL_PORT: 5432
      KC_DB_URL: jdbc:postgresql://proof-postgres:5432/keycloak
    depends_on:
      proof-postgres:
        condition: service_healthy
    command:
      - "start-dev"
      - "--import-realm"
    ports:
      - "8080:8080"

  proof-postgres:
    container_name: proof-postgres
    image: docker.io/library/postgres:17.6-alpine
    restart: always
    networks:
      - proof
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: admin
      POSTGRES_ENCODING: UNICODE
      POSTGRES_COLLATE: C
      POSTGRES_COLLATE_TYPE: C
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "proof-postgres:/var/lib/postgresql/data:rw"
      - "../services/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro"
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h proof-postgres -U admin -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  proof-redis:
    container_name: proof-redis
    image: docker.io/library/redis:8.2
    restart: always
    networks:
      - proof
    ports:
      - "6379:6379"

  proof-config-manager:
    container_name: proof-config-manager
    image: iai-artifactory.iai.kit.edu/docker-webis/proof-2/proof-config-manager:1.1.13
    restart: always
    platform: linux/amd64
    volumes:
      - "proof-files:/tmp/proof:rw"
    networks:
      - proof
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://proof-postgres:5432/proof"
      SPRING_DATA_REDIS_HOST: "proof-redis"
      WEBSOCKET_BROKER_RELAYHOST: "proof-rabbitmq"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER: http://proof-keycloak:8080/realms/proof
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://proof-keycloak:8080/realms/proof/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN-URI: http://proof-keycloak:8080/realms/proof/protocol/openid-connect/token
    ports:
      - "8100:8100"

  proof-orchestrator:
    container_name: proof-orchestrator
    image: iai-artifactory.iai.kit.edu/docker-webis/proof-2/proof-orchestrator:4.2.0
    restart: always
    platform: linux/amd64
    volumes:
      - "proof-files:/tmp/proof:rw"
      - "../services/orchestrator/proof-run-configurator.properties:/proof-run-configurator.properties:ro"
      - "../services/orchestrator/proof-run-configurator-own.properties:/proof-run-configurator-own.properties:ro"
    networks:
      - proof
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://proof-postgres:5432/proof"
      SPRING_DATA_REDIS_HOST: "proof-redis"
      SPRING_RABBITMQ_HOST: "proof-rabbitmq"
      WEBSOCKET_BROKER_RELAYHOST: "proof-rabbitmq"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER: http://proof-keycloak:8080/realms/proof
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://proof-keycloak:8080/realms/proof/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN-URI: http://proof-keycloak:8080/realms/proof/protocol/openid-connect/token
    ports:
      - "8090:8090"

  proof-frontend:
    container_name: proof-frontend
    image: iai-artifactory.iai.kit.edu/docker-webis/proof-2/proof-ui:3.0.26
    restart: always
    platform: linux/amd64
    networks:
      - proof
    ports:
      - "80:80"

  proof-rabbitmq:
    image: docker.io/library/rabbitmq:4-management-alpine
    container_name: proof-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - "../services/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro"
      - "../services/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro"
      - "../services/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro"
    networks:
      - proof
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15674:15674"
      - "61613:61613"

  proof-umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: proof-umami
    restart: always
    networks:
      - proof
    ports:
      - "3100:3000"
    environment:
      DATABASE_URL: "postgresql://admin:admin@proof-postgres:5432/umami"
      DATABASE_TYPE: "postgresql"
    depends_on:
      proof-postgres:
        condition: service_healthy
    init: true
    healthcheck:
      test: [ "CMD-SHELL", "curl http://localhost:3000/api/heartbeat" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  proof-files:
    external: false
    name: proof-files
  proof-postgres:
    external: false
    name: proof-postgres

networks:
  proof:
    external: false
    name: proof